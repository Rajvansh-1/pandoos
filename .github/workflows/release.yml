name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ─── Step 1: Create the GitHub Release ────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create.outputs.result }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read CHANGELOG entry for this tag
        id: changelog
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          BODY=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          echo "BODY<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create
        uses: actions/github-script@v7
        env:
          RELEASE_BODY: ${{ steps.changelog.outputs.BODY }}
        with:
          result-encoding: string
          script: |
            const tag  = context.ref.replace('refs/tags/', '');
            const body = process.env.RELEASE_BODY || `## 🐼 Pandoos Music ${tag}\n\nBuilding installers… assets appear below shortly.`;
            const release = await github.rest.repos.createRelease({
              owner:      context.repo.owner,
              repo:       context.repo.repo,
              tag_name:   tag,
              name:       `🐼 Pandoos Music ${tag}`,
              body:       body,
              draft:      false,
              prerelease: false,
            });
            return String(release.data.id);

  # ─── Step 2: Build on all platforms ───────────────────────────────────────
  build:
    name: Build on ${{ matrix.os }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN:               ${{ secrets.GITHUB_TOKEN }}
      VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_GOOGLE_CLIENT_ID:  ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      UPSTASH_REDIS_REST_URL:   ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      YOUTUBE_API_KEY:   ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_API_KEY_2: ${{ secrets.YOUTUBE_API_KEY_2 }}
      YOUTUBE_DL_SKIP_DOWNLOAD: "true"
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web + Electron
        run: npm run build

      - name: Build & Publish Release Assets (Signed)
        if: secrets.CSC_LINK != ''
        run: npx electron-builder --publish always
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Build & Publish Release Assets (Unsigned)
        if: secrets.CSC_LINK == ''
        run: npx electron-builder --publish always
